<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Portfolio</title>

<style>

/* ============================================================
   PREMIUM UI — Desktop Unchanged
   ============================================================ */
:root {
  --bg: #eef3f8;
  --card: rgba(255, 255, 255, 0.80);
  --border: rgba(255, 255, 255, 0.55);
  --shadow: 0 10px 35px rgba(20, 20, 20, 0.07);

  --accent: #0f172a;
  --muted: #64748b;
  --positive: #16a34a;
  --negative: #ef4444;

  --radius: 18px;
  --inner-radius: 14px;
}

body {
  margin: 0;
  padding: 32px;
  background: linear-gradient(180deg, #f8fbff 0%, #eef2f8 100%);
  font-family: "Inter", sans-serif;
  color: var(--accent);
}

.wrapper {
  max-width: 1180px;
  margin: 0 auto;
}

/* ====================== TOP CARD ====================== */
.top-card {
  background: var(--card);
  padding: 32px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px) saturate(150%);
  margin-bottom: 32px;
}

.back-btn {
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  width: fit-content;
  margin-bottom: 14px;
  opacity: 0.85;
}

.big-title {
  font-size: 2.2rem;
  font-weight: 800;
}

.sub-title {
  font-size: 1.05rem;
  color: var(--muted);
  margin-top: 6px;
}

/* ====================== CONTAINER ====================== */
.container {
  background: var(--card);
  padding: 32px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px) saturate(150%);
}

.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
  gap: 10px;
  flex-wrap: wrap;
}

.search-wrap { position: relative; }

.search {
  padding: 12px 42px 12px 16px;
  width: 280px;
  border-radius: var(--inner-radius);
  border: 1px solid rgba(0,0,0,0.08);
  background: white;
}

.search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  cursor: pointer;
}

.add-btn {
  padding: 12px 18px;
  border-radius: var(--inner-radius);
  border: 1px solid rgba(0,0,0,0.08);
  background: white;
  font-weight: 600;
  cursor: pointer;
}

/* ====================== TABLE (DESKTOP) ====================== */
.table-container { overflow: auto; }

.table {
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

.table th {
  padding: 14px 18px;
  font-size: 0.9rem;
  color: var(--muted);
  border-bottom: 1px solid rgba(0,0,0,0.06);
}

.table td {
  padding: 18px;
  background: rgba(255,255,255,0.88);
  border-bottom: 1px solid rgba(0,0,0,0.04);
}

.sector-row td {
  background: #f1f5f9;
  font-weight: 700;
}

.comp-wrap { display:flex; gap:14px; align-items:center; }

.logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: #f8fafc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  border:1px solid rgba(0,0,0,0.06);
}

.comp-name { color:var(--muted); font-size:0.88rem; }

.spark { width:160px; height:40px; }

.analysis-btn,
.remove-btn {
  padding: 5px 12px;
  border-radius: 8px;
  background: #f8fafb;
  border: 1px solid rgba(0,0,0,0.12);
  font-size: 0.80rem;
  cursor: pointer;
}

.positive { color: var(--positive); font-weight:700; }
.negative { color: var(--negative); font-weight:700; }
.vol { color: var(--muted); }

/* ============================================================
   🔥 MOBILE RESPONSIVE (ONLY AFFECTS MOBILE)
   ============================================================ */
@media (max-width: 768px) {

  body {
    padding: 15px;
  }

  .table {
    min-width: 100%;
  }

  .table thead {
    display: none;
  }

  .table tr {
    display: block;
    margin-bottom: 20px;
    border-radius: var(--inner-radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .table td {
    display: flex;
    justify-content: space-between;
    padding: 12px 15px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }

  .table td:last-child {
    border-bottom: none;
  }

  .sector-row td {
    display: block;
    font-weight: 700;
    background: #e2e8f0;
  }

  .comp-wrap {
    flex-direction: column;
    align-items: flex-start;
  }

  .spark {
    width: 100%;
  }

  .analysis-btn,
  .remove-btn {
    width: 100%;
    margin-top: 5px;
  }

}

</style>
</head>

<body>
<div class="wrapper">

  <div class="top-card">
    <div class="back-btn" onclick="location.href='/'">← Back to Dashboard</div>
    <div class="big-title">My Watchlist</div>
    <div class="sub-title">Organized by sectors</div>
  </div>

  <div class="container">

    <div class="actions">
      <div class="search-wrap">
        <input id="searchInput" class="search" placeholder="Search stocks">
        <button id="clearBtn" class="search-clear">×</button>
      </div>
      <button class="add-btn" onclick="location.href='/'">+ Add Stocks</button>
    </div>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Company</th>
            <th>Trend</th>
            <th>Mkt price</th>
            <th>1D change</th>
            <th>1D vol</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="6" style="text-align:center; padding:36px; color:var(--muted);">
              Loading portfolio…
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>

<script>
/* Keep your existing JS exactly same */
</script>

</body>
</html>
