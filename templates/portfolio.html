<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Portfolio</title>

<style>
/* ============================================================
   PREMIUM UI — Apple Glassmorphism + Modern Spacing
   ============================================================ */
:root {
  --bg: #eef3f8;
  --card: rgba(255, 255, 255, 0.80);
  --border: rgba(255, 255, 255, 0.55);
  --shadow: 0 10px 35px rgba(20, 20, 20, 0.07);

  --accent: #0f172a;
  --muted: #64748b;
  --positive: #16a34a;
  --negative: #ef4444;

  --radius: 18px;
  --inner-radius: 14px;
}

body {
  margin: 0;
  padding: 32px;
  background: linear-gradient(180deg, #f8fbff 0%, #eef2f8 100%);
  font-family: "Inter", sans-serif;
  color: var(--accent);
}

.wrapper {
  max-width: 1180px;
  margin: 0 auto;
}

/* ======================
   TOP CARD
   ====================== */
.top-card {
  background: var(--card);
  padding: 32px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px) saturate(150%);
  margin-bottom: 32px;
}

.back-btn {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  width: fit-content;
  margin-bottom: 14px;
  opacity: 0.85;
  transition: 0.2s;
}
.back-btn:hover { opacity: 1; transform: translateX(-3px); }

.big-title {
  font-size: 2.2rem;
  font-weight: 800;
}

.sub-title {
  font-size: 1.05rem;
  color: var(--muted);
  margin-top: 6px;
}

/* ======================
   Portfolio Container
   ====================== */
.container {
  background: var(--card);
  padding: 32px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px) saturate(150%);
}

.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

/* Search Field */
.search-wrap { position: relative; }
.search {
  padding: 12px 42px 12px 16px;
  width: 280px;
  border-radius: var(--inner-radius);
  border: 1px solid rgba(0,0,0,0.08);
  background: white;
  font-size: 0.95rem;
}
.search:focus {
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  outline: none;
}
.search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 18px;
  color: var(--muted);
  cursor: pointer;
}

.add-btn {
  padding: 12px 18px;
  border-radius: var(--inner-radius);
  border: 1px solid rgba(0,0,0,0.08);
  background: white;
  font-weight: 600;
  cursor: pointer;
}

/* ======================
   TABLE
   ====================== */
.table-container { overflow: auto; }
.table { width:100%; border-collapse:collapse; min-width:900px; }

.table th {
  padding: 14px 18px;
  font-size: 0.9rem;
  color: var(--muted);
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.table td {
  padding: 18px;
  background: rgba(255,255,255,0.88);
  border-bottom: 1px solid rgba(0,0,0,0.04);
  transition: 0.25s;
}

.table tbody tr:hover {
  background: white;
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.06);
}

.sector-row td {
  background: #f1f5f9;
  font-weight: 700;
  padding: 14px 20px;
  color: var(--accent);
}

/* Company block */
.comp-wrap { display:flex; gap:14px; align-items:center; }
.logo {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: #f8fafc;
  display:flex; align-items:center; justify-content:center;
  font-weight:700;
  border:1px solid rgba(0,0,0,0.06);
}
.comp-name { color:var(--muted); font-size:0.88rem; }

.spark { width:160px; height:40px; }

/* Buttons (compact + neutral style) */
.analysis-btn,
.remove-btn {
  padding: 5px 12px;
  border-radius: 8px;
  background: #f8fafb;
  border: 1px solid rgba(0,0,0,0.12);
  color: #1e293b;
  font-size: 0.80rem;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.analysis-btn:hover,
.remove-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.positive { color: var(--positive); font-weight:700; }
.negative { color: var(--negative); font-weight:700; }
.vol { color: var(--muted); }

</style>
</head>

<body>
<div class="wrapper">

  <!-- TOP CARD -->
  <div class="top-card">
    <div class="back-btn" onclick="location.href='/'">← Back to Dashboard</div>
    <div class="big-title">My Watchlist</div>
    <div class="sub-title">Organized by sectors</div>
  </div>

  <!-- PORTFOLIO TABLE -->
  <div class="container">

    <div class="actions">
      <div class="search-wrap">
        <input id="searchInput" class="search" placeholder="Search stocks">
        <button id="clearBtn" class="search-clear">×</button>
      </div>

      <button class="add-btn" onclick="location.href='/'">+ Add Stocks</button>
    </div>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Company</th>
            <th>Trend</th>
            <th>Mkt price</th>
            <th>1D change</th>
            <th>1D vol</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="tableBody">
          <tr>
            <td colspan="6" style="text-align:center; padding:36px; color:var(--muted);">
              Loading portfolio…
            </td>
          </tr>
        </tbody>

      </table>
    </div>

  </div>

</div>
<script>

/* =============================  
   FORMATTERS
   ============================= */
function fmtINR(n){
  if (!n) return "—";
  return "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
}
function fmtSigned(n){
  if (n === 0) return "0.00";
  return (n > 0 ? "+" : "−") + Math.abs(n).toFixed(2);
}
function fmtPct(n){
  if (!n) return "—";
  return (n > 0 ? "+" : "") + n.toFixed(2) + "%";
}

/* =============================
   SPARKLINE
   ============================= */
function sparklineSVG(prices){
  if (!prices || prices.length===0) return "—";
  const w=160, h=40, pad=4;
  const min=Math.min(...prices), max=Math.max(...prices);
  const span=max-min || 1;
  const step=(w-pad*2)/(prices.length-1);
  let d="";
  prices.forEach((p,i)=>{
    const x=pad+step*i;
    const y=pad+(1-(p-min)/span)*(h-pad*2);
    d+=(i?"L":"M")+x+","+y+" ";
  });
  const color = prices.at(-1) < prices[0] ? "#ef4444" : "#0f172a";
  return `<svg viewBox="0 0 ${w} ${h}"><path d="${d}" stroke="${color}" fill="none" stroke-width="2"/></svg>`;
}

/* =============================
   CACHE
   ============================= */
let portfolioCache = [];

/* =============================
   LOAD FAST
   ============================= */
async function loadPortfolio(){
  const res = await fetch('/api/portfolio_data');
  portfolioCache = (await res.json()).data || [];
  renderTable(portfolioCache);
}

/* =============================
   SUPER FAST RENDER
   ============================= */
function renderTable(items){
  const body = document.getElementById("tableBody");
  let html = "";

  if(!items.length){
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted);">No stocks added</td></tr>`;
    return;
  }

  const groups = {};
  items.forEach(it => (groups[it.sector] ||= []).push(it));

  Object.keys(groups).forEach(sec => {

    html += `
      <tr class="sector-row" data-sector="${sec}">
        <td colspan="6">${sec}</td>
      </tr>
    `;

    groups[sec].forEach(it => {
      html += `
        <tr data-sector-row="${sec}" onclick="location.href='/stock/${it.symbol}'">
          <td>
            <div class="comp-wrap">
              <div class="logo">${(it.name || it.symbol).slice(0,2).toUpperCase()}</div>
              <div>
                <div class="symbol">${it.symbol}</div>
                <div class="comp-name">${it.name}</div>
              </div>
            </div>
          </td>

          <td><div class="spark">${sparklineSVG(it.spark)}</div></td>

          <td>${fmtINR(it.price)}</td>

          <td class="${it.change_value < 0 ? 'negative' : it.change_value > 0 ? 'positive' : ''}">
            ${fmtSigned(it.change_value)} <span>(${fmtPct(it.change_percent)})</span>
          </td>

          <td class="vol">${it.volume}</td>

          <td style="display:flex; gap:10px;" onclick="event.stopPropagation();">
            <button class="analysis-btn" onclick="location.href='/stock/${it.symbol}'">Analysis</button>
            <button class="remove-btn" onclick="removeStock('${it.symbol}', this)">× Remove</button>
          </td>
        </tr>
      `;
    });
  });

  body.innerHTML = html;
}

/* =============================
   REMOVE STOCK
   ============================= */
async function removeStock(symbol, btn){
  const row = btn.closest("tr");
  const sector = row.dataset.sectorRow;

  btn.disabled = true;
  btn.innerHTML = "Removing…";

  const res = await fetch("/remove_from_portfolio", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ symbol })
  });

  const out = await res.json();

  if(!out.removed){
    btn.disabled = false;
    btn.innerHTML = "Remove";
    return;
  }

  row.style.opacity = "0";
  setTimeout(() => {
    const body = document.getElementById("tableBody");

    row.remove();

    const remaining = body.querySelectorAll(`tr[data-sector-row="${sector}"]`);
    if(remaining.length === 0){
      const header = body.querySelector(`tr[data-sector="${sector}"]`);
      if(header) header.remove();
    }
  }, 200);
}

/* =============================
   ULTRA FAST SEARCH
   ============================= */
function debounce(fn, delay){
  let timer;
  return (...args)=>{
    clearTimeout(timer);
    timer = setTimeout(()=>fn(...args), delay);
  };
}

const input = document.getElementById("searchInput");

document.getElementById("clearBtn").onclick = () => {
  input.value = "";
  renderTable(portfolioCache);
};

input.addEventListener("input", debounce(()=> {
  const q = input.value.trim().toLowerCase();
  if(!q) return renderTable(portfolioCache);
  const filtered = portfolioCache.filter(it =>
    (it.symbol + " " + it.name).toLowerCase().includes(q)
  );
  renderTable(filtered);
}, 80));

/* INIT */
loadPortfolio();

</script>
</body>
</html>
